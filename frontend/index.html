<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="ForkCast is a meal planner: save recipes, plan your week and build a shopping list.">
    <title>ForkCast</title>

    <!-- Bootstrap 5.3.3 and ForkCast styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark" aria-label="ForkCast main navigation">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#home">ForkCast</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#appNavbar"
                    aria-controls="appNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="appNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                    <li class="nav-item">
                        <a class="nav-link" href="#recipes" data-auth="user">Recipes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#discover" data-auth="user">Discover</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#planner" data-auth="user">Planner</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#profile" data-auth="user">Profile</a>
                    </li>
                    <li class="nav-item dropdown" data-role="admin">
                        <button class="nav-link dropdown-toggle" type="button" id="appAdminMenu"
                                data-bs-toggle="dropdown" aria-expanded="false">Admin</button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="appAdminMenu">
                            <li><a class="dropdown-item" href="#admin-categories">Categories</a></li>
                            <li><a class="dropdown-item" href="#admin-users">Users</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#login" data-auth="guest">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#register" data-auth="guest">Register</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main id="app"></main>

    <footer class="site-footer py-4 text-center text-white">
        <div class="container">
            <p class="mb-0 small">ForkCast - plan your week, one plate at a time</p>
        </div>
    </footer>

    <!-- Bootstrap bundle, jQuery and the application scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
